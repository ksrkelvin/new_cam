services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wecam -d wecam"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file:
      - .env
    environment:
      HTTP_ADDR: ${HTTP_ADDR}
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    image: migrate/migrate:v4.18.3
    env_file:
      - .env
    volumes:
      - ./db/migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "${DOCKER_DATABASE_URL}", "up"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
