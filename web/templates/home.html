<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>We Cam</title>
  <link rel="stylesheet" href="/static/css/app.css?v=20260913-5">
</head>
<body>
  <main class="home-shell">
    <section class="home-panel">
      <p class="eyebrow">We Cam</p>
      <h1>Compartilhe sua camera em uma sala privada.</h1>
      <p class="subtitle">Crie uma sala privada e compartilhe o link com quem voce quer chamar.</p>

      {{if .Error}}
      <p class="alert">{{.Error}}</p>
      {{end}}

      <div class="actions-grid actions-grid-single">
        <form method="post" action="/rooms" class="action-card">
          <h2>Nova sala</h2>
          <p>Gera um link unico para compartilhar.</p>
          <button type="submit">Criar sala</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
