<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>We Cam</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/static/css/app.css?v=20260915-5">
</head>
<body>
  <main class="home-shell">
    <section class="home-panel">
      <a href="/" class="brand home-brand" aria-label="We Cam">
        <span class="brand-mark">W</span>
        <span>
          <strong>We Cam</strong>
          <small>Salas privadas de video</small>
        </span>
      </a>
      <h1>Crie sua sala.</h1>
      <p class="subtitle">Defina um nome para a sala e compartilhe o link com quem voce quer chamar.</p>

      {{if .Error}}
      <p class="alert">{{.Error}}</p>
      {{end}}

      <div class="actions-grid actions-grid-single">
        <form method="post" action="/rooms" class="action-card">
          <h2><i class="fa-solid fa-door-open" aria-hidden="true"></i> Nova sala</h2>
          <label for="room-name">Nome da sala</label>
          <input id="room-name" name="name" type="text" maxlength="80" autocomplete="off" placeholder="Ex: Crônicas de Aether" required>
          <button type="submit"><i class="fa-solid fa-plus" aria-hidden="true"></i> Criar sala</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
